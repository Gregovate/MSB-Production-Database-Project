name: Setup PR regression

on:
  pull_request:
    paths:
      - 'Setup/**'
      - 'FieldWiring/Application/field_context_resolver.py'
      - '.github/workflows/setup-pr142.yml'
  workflow_dispatch:

jobs:
  setup-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Setup/Application/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Setup/Application/requirements.txt pytest

      - name: Python syntax
        run: |
          python -m py_compile \
            Setup/Application/setup_material_api.py \
            Setup/Application/production_backend.py

      - name: JavaScript syntax
        run: |
          node --check Setup/Application/setup_material.js
          node --check Setup/Application/setup_production.js
          node --check Setup/Application/setup_next_pass.js

      - name: Focused Display material tests
        run: pytest -q Setup/Application/test_setup_display_material_contract.py

      - name: Full Setup application regression
        run: pytest -q Setup/Application
