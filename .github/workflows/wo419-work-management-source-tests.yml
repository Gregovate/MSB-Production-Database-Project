name: Work Management #419 source safety and preview tests

on:
  pull_request:
    paths:
      - "WorkOrders/**"
      - "Database/Acceptance/test_wo419_unified_ticket_read_model.py"
      - "Docs/02_Production_Database/01_System_Architecture/06_Work_Orders/**"
      - ".github/workflows/wo419-work-management-source-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only source test requirements
        run: python -m pip install --disable-pip-version-check pytest flask psycopg2-binary
      - name: Verify server Bash parser without executing any runner
        run: bash -n WorkOrders/Acceptance/work_management_disposable_browser_preview_server.sh
      - name: Parse Windows PowerShell Work Management launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "WorkOrders/Acceptance/run_work_management_disposable_browser_preview.ps1",
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PASS: Windows PowerShell launcher parses"

      - name: Verify Python app/preview/clone syntax
        run: |
          python -m py_compile \
            WorkOrders/Application/backend.py \
            WorkOrders/Application/repository.py \
            WorkOrders/Application/preview_entry.py \
            WorkOrders/Acceptance/validate_work_management_clone.py
      - name: Verify browser JavaScript syntax
        run: |
          node --check WorkOrders/Application/app.js
          node --check WorkOrders/Application/review_actions.js
      - name: Run source-only Work Management safety regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            WorkOrders/Application/test_work_management_preview.py \
            WorkOrders/Acceptance/test_work_management_disposable_profile.py \
            Database/Acceptance/test_wo419_unified_ticket_read_model.py
      - name: Run full established Setup application regression
        run: python -m pytest -q -p no:cacheprovider Setup/Application Setup/Acceptance/test_setup_gis_preview.py
      - name: Run full FieldWiring application regression
        run: python -m pytest -q -p no:cacheprovider FieldWiring/Application
      - name: Production contact prohibition
        run: |
          echo "Only static and fake-repository tests run in this workflow."
          echo "No database secrets, SSH, clone, mail or Directus actions are used."
