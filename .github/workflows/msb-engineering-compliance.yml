name: MSB Engineering Compliance
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  engineering-compliance:
    name: Engineering Compliance
    runs-on: ubuntu-latest
    services:
      qc-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qc-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authority, evidence and change classification
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python System_Documentation/Automation/check_engineering_compliance.py
      - name: Validate checker negative and positive cases
        run: python -m unittest discover -s System_Documentation/Automation -p 'test_engineering_compliance.py' -v
      - name: Full Setup regression for Setup implementation changes
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha || 'HEAD^' }}" HEAD > /tmp/msb_changed_paths
          if grep -Eq '^Setup/(Application|Database|Acceptance)/' /tmp/msb_changed_paths; then
            python -m pip install pytest flask psycopg2-binary
            python -m pytest -q -p no:cacheprovider Setup/Application
          else
            echo "SKIP: No Setup implementation changes"
          fi
      - name: QC final-signoff PostgreSQL fixture without Node
        env:
          MSB_QC_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=qc-ci-only
        run: |
          if grep -Eq '^Setup/(Application|Database|Acceptance)/' /tmp/msb_changed_paths; then
            python -m pytest -q -p no:cacheprovider Setup/Application/test_122_qc_postgres.py Setup/Acceptance/test_setup_485_release.py Setup/Acceptance/test_setup_490_release.py
          fi
      - name: QC browser DOM regression without Node
        shell: bash
        run: |
          if grep -Eq '^Setup/(Application|Database|Acceptance)/' /tmp/msb_changed_paths; then
            export MSB_QC_BROWSER="$(command -v google-chrome || command -v chromium)"
            test -n "$MSB_QC_BROWSER"
            python -m pytest -q -p no:cacheprovider Setup/Application/test_122_qc_browser.py
          fi
      - name: Full FieldWiring regression for FieldWiring changes
        shell: bash
        run: |
          if grep -Eq '^FieldWiring/Application/' /tmp/msb_changed_paths; then
            python -m pip install pytest flask psycopg2-binary
            python -m pytest -q -p no:cacheprovider FieldWiring/Application
          else
            echo "SKIP: No FieldWiring application changes"
          fi
      - name: Work Management regression for Work Orders changes
        shell: bash
        run: |
          if grep -Eq '^(WorkOrders/|Database/Acceptance/test_wo419_)' /tmp/msb_changed_paths; then
            python -m pip install pytest flask psycopg2-binary -r WorkOrders/Application/requirements-auth.txt
            python -m pytest -q -p no:cacheprovider \
              WorkOrders/Application \
              WorkOrders/Acceptance/test_work_management_disposable_profile.py \
              Database/Acceptance/test_wo419_unified_ticket_read_model.py
          else
            echo "SKIP: No Work Orders application or acceptance changes"
          fi
