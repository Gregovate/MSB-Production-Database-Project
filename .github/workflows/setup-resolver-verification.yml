name: Setup resolver verification

on:
  push:
    branches:
      - agent/setup-resolver-canonical-document-root

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest -r FieldWiring/Application/requirements.txt

      - name: Run complete FieldWiring and Procedure regression
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/FieldWiring/Application:${{ github.workspace }}/Procedures/Application
        run: pytest -q FieldWiring/Application Procedures/Application
